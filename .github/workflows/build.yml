name: Build installer zips

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build offline installer zip
        run: |
          cp offline_setup.sh setup.sh
          cp offline_setup.sh customize.sh
          zip -r -q "PE-Revived-offline-${GITHUB_REF_NAME}.zip" . \
            -x '.git/*' 'tweaks-app/*' 'Modifications/*' 'screenshots/*' \
            'builder.sh' 'builder_dependencies.sh' \
            'banner.jpg' 'banner2.jpg' 'changelog.md' 'logo.png' \
            'online_setup.sh' 'offline_setup.sh' 'manual_setup.sh' 'config.txt' \
            'customize_setup.sh' 'manual_installer_instructions.md' 'README.md' \
            'update.json' '.github/*' '.gitattributes' '.gitignore' \
            'Pixel Launcher Extended*' 'PE-Revived*'
          rm setup.sh
          rm customize.sh

      - name: Build online installer zip
        run: |
          cp online_setup.sh setup.sh
          cp online_setup.sh customize.sh
          zip -r -q "PE-Revived-online-${GITHUB_REF_NAME}.zip" . \
            -x '.git/*' 'tweaks-app/*' 'Modifications/*' 'screenshots/*' \
            'builder.sh' 'builder_dependencies.sh' \
            'banner.jpg' 'banner2.jpg' 'changelog.md' 'logo.png' \
            'offline_setup.sh' 'customize_setup.sh' 'online_setup.sh' 'manual_setup.sh' \
            'manual_installer_instructions.md' 'config.txt' 'README.md' \
            'update.json' '.github/*' '.gitattributes' '.gitignore' \
            'system/product/priv-app/NexusLauncherRelease/**' \
            'system/system_ext/priv-app/NexusLauncherRelease/*' \
            'system/product/priv-app/PixelLauncherMods/PixelLauncherMods.apk' \
            'system/product/overlay/ThemedIconsOverlay/**' \
            'system/system_ext/priv-app/WallpaperPickerGoogleRelease/*' \
            'system/product/overlay/TeamFiles*' \
            'shapes/*' \
            'Pixel Launcher Extended*' 'PE-Revived*'
          rm setup.sh
          rm customize.sh

      - name: Build manual installer zip
        run: |
          cp manual_setup.sh setup.sh
          cp manual_setup.sh customize.sh
          zip -r -q "PE-Revived-manual-${GITHUB_REF_NAME}.zip" . \
            -x '.git/*' 'tweaks-app/*' 'Modifications/*' 'screenshots/*' \
            'builder.sh' 'builder_dependencies.sh' \
            'banner.jpg' 'banner2.jpg' 'changelog.md' 'logo.png' \
            'online_setup.sh' 'offline_setup.sh' 'manual_setup.sh' \
            'manual_installer_instructions.md' 'customize_setup.sh' 'README.md' \
            'update.json' '.github/*' '.gitattributes' '.gitignore' \
            'Pixel Launcher Extended*' 'PE-Revived*'
          rm setup.sh
          rm customize.sh

      - name: Upload zips to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "PE-Revived ${GITHUB_REF_NAME}" \
              --notes "PE-Revived ${GITHUB_REF_NAME}" \
              --prerelease
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            "PE-Revived-offline-${GITHUB_REF_NAME}.zip" \
            "PE-Revived-online-${GITHUB_REF_NAME}.zip" \
            "PE-Revived-manual-${GITHUB_REF_NAME}.zip" \
            --clobber
